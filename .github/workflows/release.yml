name: Release

on:
  push:
    tags:
      - "v+([0-9]).+([0-9]).+([0-9])"
      - "v+([0-9]).+([0-9]).+([0-9])-@(alpha|beta|rc)-+([0-9])"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Version always comes from the git tag itself, via the git-version plugin in build.gradle.kts.
      # Tag format is enforced by a GitHub ruleset - this step only picks the publishing channel:
      # "major.minor.patch" -> stable. "major.minor.patch-alpha-N" -> alpha, "-beta-N" -> beta, "-rc-N" -> eap.
      - name: Determine publish channel
        id: release
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)-[0-9]+$ ]]; then
            case "${BASH_REMATCH[1]}" in
              alpha) CHANNEL="alpha" ;;
              beta) CHANNEL="beta" ;;
              rc) CHANNEL="eap" ;;
            esac
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Build and verify plugin
        run: ./gradlew build verifyPlugin verifyPluginStructure verifyPluginProjectConfiguration

      - name: Get changelog for this release
        id: changelog
        run: |
          {
            echo 'content<<EOF'
            ./gradlew getChangelog --unreleased --no-header --console=plain -q
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Patch changelog
        run: ./gradlew patchChangelog

      - name: Sign plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin

      - name: Publish plugin to JetBrains Marketplace
        env:
          JETBRAINS_PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin -PpublishChannel="${{ steps.release.outputs.channel }}"

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          files: build/distributions/*
          prerelease: ${{ steps.release.outputs.channel != 'stable' }}
